[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ck-dps-solver"
dynamic = ["version"]
description = "Finds the gear loadout with the highest damage per second for a Core Keeper character."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sinisterbot" }]
requires-python = ">=3.13"
# Minimums are the versions it is tested with
dependencies = [
    "brotli>=1.2",
    "numba>=0.68",
    "numpy>=2.5",
    "pandas>=3.0",
    "PySide6>=6.12",
    "tqdm>=4.70",
]
keywords = ["core keeper", "dps", "calculator", "loadout", "optimizer"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.22"]

[project.urls]
Homepage = "https://github.com/sinisterbot7900/ck-dps-solver"
Issues = "https://github.com/sinisterbot7900/ck-dps-solver/issues"
Changelog = "https://github.com/sinisterbot7900/ck-dps-solver/blob/main/CHANGELOG.md"

[project.scripts]
ck-dps-solver = "ck_dps_solver.cli:main"

[project.gui-scripts]
ck-dps-solver-gui = "ck_dps_solver.app.main:main"

[tool.setuptools.dynamic]
version = { attr = "ck_dps_solver.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ck_dps_solver = ["data/*.json", "data/*.png", "data/icons/*"]
